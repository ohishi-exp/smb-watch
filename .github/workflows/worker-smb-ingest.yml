name: worker-smb-ingest

# workers/smb-ingest (Refs #14)。
#   - pull_request (全 PR。paths で絞らない) / main への push → logic の test、Worker の build・公開範囲の検査・wrangler deploy --dry-run
#   - タグ worker-smb-ingest-v*      → 本番へ deploy (wrangler.toml のトップレベル。env は持たない)
# v*.*.* タグは使わない (過去の native リリースの名残)。
# この workflow が repo 唯一の CI。pull_request は全 PR で走り、auto-merge job を持つ (docs だけの PR も検査を通って merge される)。
# account_id は書かない (CLOUDFLARE_API_TOKEN から決まる)。wrangler の出力はファイルに取り、mask してから伏せて出す。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['worker-smb-ingest-v*']
    paths:
      - 'workers/smb-ingest/**'
      - '.github/workflows/worker-smb-ingest.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # README と揃える
  WRANGLER_VERSION: 4.144.0

jobs:
  logic:
    name: Test + wasm32 build (logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          # worker / deploy の job とは target の中身が違うので別のキー
          shared-key: smb-ingest-logic
          workspaces: workers/smb-ingest -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo test --manifest-path workers/smb-ingest/Cargo.toml -p smb-ingest-logic

      - name: Build (wasm32-unknown-unknown)
        run: cargo build --manifest-path workers/smb-ingest/Cargo.toml -p smb-ingest-logic --target wasm32-unknown-unknown

  worker:
    name: Worker build + exposure + wrangler dry-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/smb-ingest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          # build の job とデプロイの job で同じキャッシュを使う (既定のキーは job 名を含み、デプロイから引けない)
          shared-key: smb-ingest-worker
          workspaces: workers/smb-ingest -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Exposure check
        run: bash scripts/check-exposure.sh worker/wrangler.toml

      - name: Exposure check (negative control)
        run: bash scripts/check-exposure-test.sh worker/wrangler.toml

      # wrangler.toml の [build] command と同じ版
      - run: cargo install -q worker-build@0.8.7 --locked

      - name: worker-build --release
        working-directory: workers/smb-ingest/worker
        run: worker-build --release

      # secret も token も要らない (build と設定の検証だけ)
      - name: wrangler deploy --dry-run
        working-directory: workers/smb-ingest/worker
        run: npx -y "wrangler@${WRANGLER_VERSION}" deploy --dry-run

  deploy:
    name: deploy production
    needs: [logic, worker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/worker-smb-ingest-v')
    runs-on: ubuntu-latest
    concurrency:
      group: smb-ingest-deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/smb-ingest/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          # build の job とデプロイの job で同じキャッシュを使う (既定のキーは job 名を含み、デプロイから引けない)
          # 保存は worker の job に任せ、ここは復元だけ
          shared-key: smb-ingest-worker
          workspaces: workers/smb-ingest -> target
          save-if: false

      - run: cargo install -q worker-build@0.8.7 --locked

      # wrangler の出力は $RUNNER_TEMP/deploy.log に取り、伏せてから出す (ログファイルそのものは出さない)。
      #   - 32 桁の hex (account ID): ::add-mask:: + <account> に置換
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          log="$RUNNER_TEMP/deploy.log"
          status=0
          npx -y "wrangler@${WRANGLER_VERSION}" deploy \
            --tag "$GITHUB_REF_NAME" --message "$GITHUB_SHA" >"$log" 2>&1 || status=$?
          # 何かを出す前に mask を登録する
          grep -oE '[0-9A-Fa-f]{32}' "$log" | sort -u | while read -r hex; do
            echo "::add-mask::${hex}"
          done
          sed -E -e 's#[A-Za-z0-9.-]+\.workers\.dev#<workers-dev>#g' -e 's#[0-9A-Fa-f]{32}#<account>#g' "$log"
          [ "$status" = 0 ] || exit "$status"
          # workers_dev = false なので workers.dev の URL は出ないはず (出たら公開されている)
          if grep -qE '[A-Za-z0-9.-]+\.workers\.dev' "$log"; then
            echo "::error::本番に workers.dev の URL が付いた (workers_dev = false のはず。直ちに止めること)"
            exit 1
          fi

  # CI green 後に squash auto-merge を queue する (org 標準の caller-composed pattern)。
  # deploy job は push (merge 後) のみ走るので auto-merge (PR run) とは排他 = merge -> branch 削除で
  # deploy が cancel される race は起きない。auto-merge.yml の deploy gate 静的検査は DAG だけ見て
  # trigger 排他を判別できず deploy を needs 未配線として loud fail するので deploy_gate_ignore で除外する。
  auto-merge:
    if: github.event_name == 'pull_request'
    needs: [logic, worker]
    uses: ippoan/ci-workflows/.github/workflows/auto-merge.yml@main
    with:
      deploy_gate_ignore: 'deploy'
    # auto-merge.yml は GitHub App credential (CI_APP_ID / CI_APP_PRIVATE_KEY) 必須。
    # reusable が **別 org (ippoan)** にあるため `secrets: inherit` は効かない
    # (inherit は同一 org / enterprise 内の reusable にしか渡さない)。ohishi-exp org
    # secret を named secret として明示的に渡す。
    secrets:
      CI_APP_ID: ${{ secrets.CI_APP_ID }}
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write
